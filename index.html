<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>🔒 TERKUNCI</title>
<style>
* {margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none;}
html, body {
  background: radial-gradient(circle at center, #1a0000 0%, #000000 70%);
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #ff0000;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.box {
  background: #111;
  border: 3px solid #ff0000;
  border-radius: 12px;
  padding: 40px 30px;
  max-width: 380px;
  width: 90%;
  text-align: center;
  box-shadow: 0 0 40px rgba(255, 0, 0, 0.4);
}
@keyframes getar {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.getar-anim {
  animation: getar 0.3s ease-in-out;
}
.box h2 {
  color: #ff0000;
  font-size: 22px;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 0 0 10px #ff0000;
}
.box p {
  color: #ccc;
  font-size: 14px;
  margin-bottom: 25px;
  line-height: 1.6;
}
.box input {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  text-align: center;
  background: #000;
  border: 2px solid #ff0000;
  color: #fff;
  border-radius: 6px;
  outline: none;
  letter-spacing: 2px;
}
.box button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: #ff0000;
  color: #000;
  border: none;
  font-size: 16px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}
.box button:active {background: #cc0000;}
.salah {
  color: #ff6666;
  font-size: 13px;
  margin-top: 12px;
  display: none;
}
.credit {
  color: #333;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>
<body>

<audio id="musik" loop>
  <source src="https://www.soundjay.com/ambient/sounds/horror-ambient-01.mp3" type="audio/mpeg">


<div class="box getar-anim" id="kotak">
  <h2>🔒 TERKUNCI!</h2>
  <p>Halaman ini telah dikunci.<br>Masukkan kata sandi untuk membukanya.</p>
  <input type="text" id="pass" placeholder="Masukkan kata sandi...">
  <button onclick="cek()">KIRIM</button>
  <div class="salah" id="salah">❌ Kata sandi salah! Coba lagi</div>
  <div class="credit">by @bnzzzz</div>
</div>

<script>
const PASSWORD = "@bnzzzz";
const musik = document.getElementById('musik');
const kotak = document.getElementById('kotak');

// LAYAR PENUH
function masukLayarPenuh() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
  else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
}
document.addEventListener('touchstart', masukLayarPenuh, { once: true });
document.addEventListener('click', masukLayarPenuh, { once: true });

// GETAR + SUARA SAAT DIBUKA
window.addEventListener('load', () => {
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
  const mulaiAudio = () => {
    musik.volume = 0.5;
    musik.play().catch(() => {});
  };
  document.addEventListener('touchstart', mulaiAudio, { once: true });
  document.addEventListener('click', mulaiAudio, { once: true });
});

// CEK KATA SANDI
function cek() {
  const input = document.getElementById('pass').value;
  const salah = document.getElementById('salah');
  
  if (input === PASSWORD) {
    musik.pause();
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    document.body.style.background = 'linear-gradient(#0a0a0a, #111)';
    document.body.innerHTML = `
      <div style="text-align:center;color:#0f0;padding:40px;">
        <h2>✅ TERBUKA!</h2>
        <p style="color:#aaa;margin-top:15px;">Berhasil dibuka 😄</p>
        <p style="color:#666;font-size:12px;margin-top:30px;">Boleh tutup halaman ini</p>
        <p style="color:#444;font-size:10px;margin-top:40px;">by @bnzzzz</p>
      </div>
    `;
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else {
    salah.style.display = 'block';
    kotak.classList.remove('getar-anim');
    void kotak.offsetWidth;
    kotak.classList.add('getar-anim');
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 600]);
    document.getElementById('pass').value = '';
  }
}

// BLOKIR TOMBOL KEMBALI DI BROWSER
history.pushState({ locked: true }, '', location.href);
history.pushState({ locked: true }, '', location.href);
history.pushState({ locked: true }, '', location.href);

window.addEventListener('popstate', () => {
  history.pushState({ locked: true }, '', location.href);
  history.go(1);
});

setInterval(() => {
  if (window.history.state && window.history.state.locked !== true) {
    history.pushState({ locked: true }, '', location.href);
  }
}, 100);

// PERINGATAN SAAT MAU TUTUP TAB
window.addEventListener('beforeunload', e => {
  e.preventDefault();
  e.returnValue = '⚠️ Masih terkunci! Yakin mau keluar?';
  return e.returnValue;
});

// BLOKIR TOMBOL PINTAS
document.addEventListener('keydown', e => {
  const dilarang = [
    'Escape','F11','F5','F12','AltLeft','AltRight','ControlLeft','ControlRight',
    'w','W','t','T','n','N','r','R','Backspace','Home','End','PageUp','PageDown'
  ];
  if (dilarang.includes(e.key) || e.altKey || e.ctrlKey || e.metaKey || e.keyCode === 91) {
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    return false;
  }
}, true);

// BLOKIR KLIK KANAN & TEKAN LAMA
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('mousedown', e => e.preventDefault());
document.addEventListener('touchstart', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// FOKUS TERUS KE INPUT
setInterval(() => {
  const input = document.getElementById('pass');
  if (input && document.activeElement !== input) input.focus();
}, 100);
</script>

</body>
</html>
