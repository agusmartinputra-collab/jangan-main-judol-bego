<!DOCTYPE html>
<html>
<head>
<style>
* {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace;}
body {
  background: #0a0a0a;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #ff3333;
  padding: 20px;
}
.box {
  background: #151515;
  border: 2px solid #ff3333;
  border-radius: 12px;
  padding: 40px 30px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
}
h2 {
  text-align: center;
  color: #ff3333;
  margin-bottom: 25px;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.msg {
  background: #222;
  padding: 15px;
  border-radius: 6px;
  margin-bottom: 25px;
  line-height: 1.7;
  font-size: 14px;
  color: #ff6666;
  text-align: center;
}
.input-kunci {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  text-align: center;
  background: #000;
  border: 1px solid #ff3333;
  color: #fff;
  border-radius: 6px;
  outline: none;
  letter-spacing: 4px;
}
.tombol {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  background: #ff3333;
  color: #000;
  border: none;
  font-size: 16px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
}
.tombol:hover {background: #cc0000;}
.hasil {
  margin-top: 20px;
  text-align: center;
  font-size: 15px;
  display: none;
}
.benar {color: #00ff66;}
.salah {color: #ff6666;}
.credit {
  margin-top: 25px;
  font-size: 11px;
  text-align: center;
  color: #666;
}
</style>
</head>
<body>

<div class="box">
  <h2>🔒 JANGAN MAIN JUDI BEGO</h2>
  
  <div class="msg">
    Masukkan kunci untuk melanjutkan
  </div>

  <input type="text" id="kunci" class="input-kunci" placeholder="Masukkan kunci...">
  
  <button class="tombol" onclick="cekKunci()">Buka</button>
  
  <div id="hasil-benar" class="hasil benar">✅ Kunci Benar! Tetap semangat, jangan nyerah!</div>
  <div id="hasil-salah" class="hasil salah">❌ Kunci salah, coba lagi</div>

  <div class="credit">
    by: @bnzzz22
  </div>
</div>

<script>
const KUNCI_BENAR = "676767";

function cekKunci() {
  const input = document.getElementById('kunci').value;
  const benar = document.getElementById('hasil-benar');
  const salah = document.getElementById('hasil-salah');
  
  benar.style.display = 'none';
  salah.style.display = 'none';
  
  if (input === KUNCI_BENAR) {
    benar.style.display = 'block';
  } else {
    salah.style.display = 'block';
  }
}
</script>

</body>
</html>
