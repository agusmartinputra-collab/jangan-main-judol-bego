<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mode Kiosk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            background: #fff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Tombol tersembunyi di sudut kanan atas, tekan 5x untuk keluar */
        .zona-kunci {
            position: fixed;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            z-index: 10;
            cursor: default;
        }

        /* Layar kode */
        .layar-kode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .kotak {
            background: white;
            border-radius: 16px;
            padding: 30px 25px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        .kotak h3 { margin-bottom: 15px; color: #1f2937; }
        .input-baris {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-baris input {
            width: 45px; height: 50px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .batal { background: #e5e7eb; color: #333; }
        .salah { color: #dc2626; font-size: 13px; margin-top: 8px; display: none; }
        .info-petunjuk {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 10px;
            color: rgba(0,0,0,0.05);
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Website langsung tampil -->
    <iframe id="web" src="https://www.google.com"></iframe>

    <!-- Zona tersembunyi: tekan 5x di pojok kanan atas untuk keluar -->
    <div class="zona-kunci" id="zonaKeluar" onclick="tekanKeluar()"></div>

    <!-- Layar kode keluar -->
    <div class="layar-kode" id="layarKode">
        <div class="kotak">
            <h3>🔒 Masukkan Kode</h3>
            <div class="input-baris">
                <input type="password" maxlength="1" id="k1" oninput="lanjut(1)">
                <input type="password" maxlength="1" id="k2" oninput="lanjut(2)">
                <input type="password" maxlength="1" id="k3" oninput="lanjut(3)">
                <input type="password" maxlength="1" id="k4" oninput="lanjut(4)">
            </div>
            <button onclick="cekKode()">KONFIRMASI</button>
            <button class="batal" onclick="tutupLayar()">BATAL</button>
            <div class="salah" id="pesanSalah">Kode salah</div>
        </div>
    </div>

    <script>
        // === PENGATURAN ===
        const KODE = '1234';
        const LINK = 'https://www.google.com';
        let hitungTekan = 0;
        let timer = null;

        // Muat konten
        document.getElementById('web').src = LINK;

        // Tekan 5x di pojok kanan atas untuk munculkan layar kode
        function tekanKeluar() {
            hitungTekan++;
            clearTimeout(timer);
            timer = setTimeout(() => {
                hitungTekan = 0;
            }, 1500);
            
            if (hitungTekan >= 5) {
                hitungTekan = 0;
                munculLayar();
            }
        }

        function munculLayar() {
            document.getElementById('layarKode').style.display = 'flex';
            document.getElementById('k1').focus();
        }

        function tutupLayar() {
            document.getElementById('layarKode').style.display = 'none';
            ['k1','k2','k3','k4'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('pesanSalah').style.display = 'none';
        }

        function lanjut(n) {
            if (n < 4 && document.getElementById('k'+n).value) {
                document.getElementById('k'+(n+1)).focus();
            }
        }

        function cekKode() {
            const kode = 
                document.getElementById('k1').value +
                document.getElementById('k2').value +
                document.getElementById('k3').value +
                document.getElementById('k4').value;
            
            if (kode === KODE) {
                alert('✅ Kode benar — tutup aplikasi secara manual');
                tutupLayar();
            } else {
                document.getElementById('pesanSalah').style.display = 'block';
                ['k1','k2','k3','k4'].forEach(id => document.getElementById(id).value = '');
                document.getElementById('k1').focus();
            }
        }

        // Cegah tombol kembali di browser
        history.pushState({}, '', location.href);
        window.addEventListener('popstate', () => {
            history.pushState({}, '', location.href);
        });
    </script>
</body>
</html>
