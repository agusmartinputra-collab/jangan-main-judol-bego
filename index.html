
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HP MU TELAH TERKUNCI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#100000;color:white;font-family:Arial,sans-serif
}
.panel{
  width: min(88%,360px);padding:26px 22px;text-align:center;
  background:#1b1111;border:2px solid #e00000;border-radius:16px;
  box-shadow:0 0 24px #650000
}
h2{color:#ff2929;font-size:24px}
input,button{
  width:100%;padding:13px;margin-top:12px;border-radius:8px;
  font-size:16px
}
input{background:#292020;color:white;border:1px solid #704040}
button{background:#c90000;color:white;border:0;font-weight:bold}
#status{font-size:13px;color:#ffaaaa;min-height:18px}
footer{margin-top:24px;color:#999;font-size:12px}
</style>
</head>
<body>
<main class="panel" id="panel">
  <h2>HP MU TELAH TERKUNCI</h2>
  <p>Masukkan kode untuk menutup panel ini.</p>
  <input id="pin" type="password" inputmode="numeric"
         placeholder="Masukkan PIN">
  <button id="unlock">BUKA KUNCI</button>
  <p id="status"></p>
  <footer>by @bnzzz28</footer>
</main>
<script>
const PIN = "7891234";

document.getElementById("unlock").onclick = () => {
  const input = document.getElementById("pin");
  const status = document.getElementById("status");

  if (input.value === PIN) {
    document.getElementById("panel").remove();
    document.body.innerHTML =
      "<h2 style='color:white'>Panel ditutup.</h2>";
  } else {
    status.textContent = "Kode salah. Coba lagi.";
    input.value = "";
  }
};
</script>
</body>
</html>
